name: Check - Osaka evm2 Compute

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/ci.compute.yaml'
      - 'analyzer/**'
      - 'cmd/benchmarkoor/**'
      - 'pkg/compute/**'
      - 'pkg/config/**'
      - 'Dockerfile.compute-*'
      - 'scripts/compute/**'
      - 'examples/configuration/compute*.yaml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [master]
    paths:
      - '.github/workflows/ci.compute.yaml'
      - 'analyzer/**'
      - 'cmd/benchmarkoor/**'
      - 'pkg/compute/**'
      - 'pkg/config/**'
      - 'Dockerfile.compute-*'
      - 'scripts/compute/**'
      - 'examples/configuration/compute*.yaml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      evm2_ref:
        description: 'Published 40-character commit SHA for alloy-rs/evm2'
        required: true
        type: string
      execution_specs_ref:
        description: 'Published 40-character commit SHA for weiihann/execution-specs'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compute-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compute-contract:
    name: Compute contract, reconciliation, and export
    runs-on: ubuntu-latest
    steps:
      - name: Check out benchmarkoor
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Test compute boundaries
        env:
          CGO_ENABLED: '0'
        run: >-
          go test -tags
          'exclude_graphdriver_btrfs,exclude_graphdriver_devicemapper,containers_image_openpgp'
          ./pkg/config ./pkg/compute

  analyzer:
    name: Analyzer tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - name: Check out benchmarkoor
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          cache-dependency-glob: analyzer/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Test
        run: uv run pytest

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

  cross-repository-smoke:
    name: Pinned cross-repository compute smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out benchmarkoor
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require immutable source revisions
        env:
          EVM2_REF: ${{ inputs.evm2_ref }}
          EXECUTION_SPECS_REF: ${{ inputs.execution_specs_ref }}
        run: |
          for revision in "$EVM2_REF" "$EXECUTION_SPECS_REF"; do
            if [[ ! "$revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf 'source revision must be a published 40-character commit SHA: %s\n' "$revision" >&2
              exit 1
            fi
          done

      - name: Check out pinned evm2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: alloy-rs/evm2
          ref: ${{ inputs.evm2_ref }}
          path: third_party/evm2
          persist-credentials: false

      - name: Check out pinned execution-specs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: weiihann/execution-specs
          ref: ${{ inputs.execution_specs_ref }}
          path: third_party/execution-specs
          persist-credentials: false

      - name: Expose frozen sibling contexts
        run: |
          ln -s "$GITHUB_WORKSPACE/third_party/evm2" "$GITHUB_WORKSPACE/../evm2"
          ln -s "$GITHUB_WORKSPACE/third_party/execution-specs" "$GITHUB_WORKSPACE/../execution-specs"

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Run real evm2 compute smoke
        env:
          COMPUTE_SMOKE_RESULTS_DIR: ${{ github.workspace }}/results/compute-smoke-ci
        run: scripts/compute/smoke.sh

      - name: Retain compute smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compute-smoke-${{ github.run_id }}
          path: results/compute-smoke-ci
          if-no-files-found: warn
