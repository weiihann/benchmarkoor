name: Check - Osaka Compute

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/ci.compute.yaml'
      - 'analyzer/**'
      - 'cmd/benchmarkoor/**'
      - 'pkg/compute/**'
      - 'pkg/config/**'
      - 'Dockerfile.compute-*'
      - 'scripts/compute/**'
      - 'examples/configuration/compute*.yaml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [master]
    paths:
      - '.github/workflows/ci.compute.yaml'
      - 'analyzer/**'
      - 'cmd/benchmarkoor/**'
      - 'pkg/compute/**'
      - 'pkg/config/**'
      - 'Dockerfile.compute-*'
      - 'scripts/compute/**'
      - 'examples/configuration/compute*.yaml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: compute-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compute-contract:
    name: Compute contract, reconciliation, and export
    runs-on: ubuntu-latest
    steps:
      - name: Check out benchmarkoor
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.24'
          cache-dependency-path: go.sum

      - name: Test compute boundaries
        env:
          CGO_ENABLED: '0'
        run: >-
          go test -tags
          'exclude_graphdriver_btrfs,exclude_graphdriver_devicemapper,containers_image_openpgp'
          ./pkg/config ./pkg/compute

  analyzer:
    name: Analyzer tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - name: Check out benchmarkoor
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          cache-dependency-glob: analyzer/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Test
        run: uv run pytest

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
